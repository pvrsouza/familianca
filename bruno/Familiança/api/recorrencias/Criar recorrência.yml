info:
  name: Criar recorrência
  type: http
  seq: 3
  tags:
    - Recorrências

http:
  method: POST
  url: "{{baseUrl}}/api/recorrencias"
  body:
    type: json
    data: |-
      {
        "categoriaId": 1,
        "descricao": "Condomínio",
        "valor": 650,
        "dia": 10,
        "frequencia": "MENSAL",
        "inicio": "2026-01",
        "fim": null,
        "confirmarSozinha": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |
  Frequências: MENSAL, BIMESTRAL, TRIMESTRAL, SEMESTRAL, ANUAL.
  confirmarSozinha (só despesa): o que vence a partir de hoje vira lançamento sozinho (débito automático).
