info:
  name: MFA - desativar
  type: http
  seq: 9
  tags:
    - Autenticação

http:
  method: POST
  url: "{{baseUrl}}/api/conta/mfa/desativacao"
  body:
    type: json
    data: |-
      {
        "senha": "{{process.env.LOGIN_SENHA}}",
        "codigo": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |
  Exige a senha e um código (do aplicativo ou de recuperação).
