info:
  name: Informar saldo
  type: http
  seq: 2
  tags:
    - Saldos

http:
  method: PUT
  url: "{{baseUrl}}/api/saldos/2026-10"
  body:
    type: json
    data: |-
      {
        "porLocal": [
          { "localId": 1, "valor": 95000 },
          { "localId": 2, "valor": 5000 }
        ],
        "observacao": "Conferido no extrato",
        "dataReferencia": "2026-10-18"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |
  Saldo lugar a lugar (porLocal): o total é a soma. Para corrigir rápido, mande só "valor". Com dataReferencia, o
  valor é o saldo nesse dia e o fluxo volta até o dia 1º.
